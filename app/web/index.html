<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="BhoomiSetu connects farmers and buyers through transparent digital trade.">
  <meta name="theme-color" content="#166534">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BhoomiSetu">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>BhoomiSetu</title>
  <style>
    html, body { height: 100%; margin: 0; background: #f6fbf6; }
    #app-loader {
      position: fixed; inset: 0; display: grid; place-items: center;
      font-family: Arial, sans-serif; color: #17351f; background: #f6fbf6;
      z-index: 9999; transition: opacity .2s ease;
    }
    #app-loader .card { text-align: center; padding: 28px; }
    #app-loader .mark { font-size: 42px; margin-bottom: 12px; }
    #app-loader strong { display: block; font-size: 24px; margin-bottom: 8px; }
    #app-loader span { color: #55705d; }
    #app-loader .bar {
      width: 220px; height: 4px; margin-top: 20px; overflow: hidden;
      border-radius: 8px; background: #dcebdd;
    }
    #app-loader .bar::after {
      content: ''; display: block; width: 45%; height: 100%;
      background: #238636; animation: loading 1.1s ease-in-out infinite alternate;
    }
    @keyframes loading { from { transform: translateX(-20%); } to { transform: translateX(145%); } }
  </style>
</head>
<body>
  <div id="app-loader" role="status" aria-live="polite">
    <div class="card">
      <div class="mark">🌱</div>
      <strong>BhoomiSetu</strong>
      <span>Preparing your farming marketplace…</span>
      <div class="bar"></div>
    </div>
  </div>
  <script>
    fetch('https://bhoomisetu-backend-5lrq.onrender.com/api/v1/health', { mode: 'cors' }).catch(() => {});
    window.addEventListener('flutter-first-frame', () => {
      const loader = document.getElementById('app-loader');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(() => loader.remove(), 220);
      }
    });
  </script>
  <script>
    // A previously published Flutter service worker cached configuration files
    // as the SPA shell. Clean it up before booting so existing visitors receive
    // the current API configuration instead of an HTML fallback response.
    (async () => {
      const resetKey = 'bhoomisetu-service-worker-reset-v2';
      let wasControlled = false;

      if ('serviceWorker' in navigator) {
        wasControlled = navigator.serviceWorker.controller !== null;
        const registrations = await navigator.serviceWorker.getRegistrations();
        await Promise.all(registrations.map((registration) => registration.unregister()));
      }

      if ('caches' in window) {
        const cacheNames = await caches.keys();
        await Promise.all(cacheNames.map((cacheName) => caches.delete(cacheName)));
      }

      if (wasControlled && sessionStorage.getItem(resetKey) !== 'complete') {
        sessionStorage.setItem(resetKey, 'complete');
        const refreshedUrl = new URL(window.location.href);
        refreshedUrl.searchParams.set('app-refresh', Date.now().toString());
        window.location.replace(refreshedUrl.toString());
        return;
      }

      sessionStorage.removeItem(resetKey);
      const bootstrap = document.createElement('script');
      bootstrap.src = `flutter_bootstrap.js?v=${Date.now()}`;
      bootstrap.async = true;
      document.body.appendChild(bootstrap);
    })().catch((error) => {
      console.error('Unable to prepare BhoomiSetu for startup', error);
      const bootstrap = document.createElement('script');
      bootstrap.src = `flutter_bootstrap.js?v=${Date.now()}`;
      bootstrap.async = true;
      document.body.appendChild(bootstrap);
    });
  </script>
</body>
</html>
